# Minimal Supabase local config — see https://supabase.com/docs/guides/cli/config
project_id = "society-sync"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["exp://127.0.0.1:8081"]

[functions]
verify_jwt = false
